server:
  port: 8081

spring:
  application:
    name: rsiis-business
  # 字段名对齐原 Python 接口 (snake_case), 前端零改动
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${RSIIS_DB_HOST:localhost}:${RSIIS_DB_PORT:5432}/${RSIIS_DB_NAME:rsiis_business}
    username: ${RSIIS_DB_USER:postgres}
    password: ${RSIIS_DB_PASSWORD:001117}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  # schema.sql 幂等 (IF NOT EXISTS), 每次启动执行兜底建表
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  # Python AI 服务地址 (内部代理调用目标)
  python-base-url: ${PYTHON_BASE_URL:http://127.0.0.1:8020}
  # 服务间静态令牌, 需与 Python 侧 INTERNAL_API_TOKEN 一致
  internal-token: ${INTERNAL_API_TOKEN:rsiis-dev-internal-token}
  security:
    # off: HTTP 层全放行 (迁移期默认); observe: 解析 token 但不拦截; enforce: 除 auth 外均需 JWT
    # ★ 管理端 /api/v1/admin/** 始终由方法级权限校验, 与 mode 无关。
    mode: ${SECURITY_MODE:off}
    jwt-secret: ${JWT_SECRET:rsiis-dev-jwt-secret-key-please-change-it-32b}
    # 旧版字段保留兼容; 新代码使用 access-ttl-minutes / refresh-ttl-days
    jwt-ttl-hours: 24
    access-ttl-minutes: ${ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${REFRESH_TTL_DAYS:14}
    # 已确认：管理端强制 MFA。生产必须 true；本地联调可临时 false。
    mfa-required: ${MFA_REQUIRED:true}
    mfa-issuer: ${MFA_ISSUER:国土智察}
    # 留空时由 jwt-secret 派生；生产建议独立配置 32 字节 Base64 密钥。
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}

logging:
  level:
    com.rsiis: INFO
