# 国土智察统一入口 (nginx)
#
# 架构: Java 业务服务 (8081) + Python AI 服务 (8020) + GeoServer (8080)
# 分流规则与 frontend-vue/vite.config.js 开发期代理保持一致:
#   /api/v1/{auth,projects,workspace,conversations,tasks} → Java
#   /api/v1/agent/ws/*                                    → Python (WebSocket)
#   其余 /api/*                                           → Python (默认)
#   /geoserver/*                                          → GeoServer 直达
#   /                                                     → 前端静态文件 (frontend-vue/dist)
#
# ★ /internal/* 永不在此暴露 (仅 Python 本机回环供 Java 调用)。
# 使用: nginx -c /path/to/deploy/nginx.conf (路径按实际部署调整)

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 512m;   # 影像上传

    # WebSocket 升级映射 (推理聊天通道)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 上游
    upstream java_backend {
        server 127.0.0.1:8081;
    }
    upstream python_backend {
        server 127.0.0.1:8020;
    }
    upstream geoserver_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 8090;
        server_name _;

        # ---------- Java 业务服务 (白名单, 每迁一个路由加一行) ----------
        location /api/v1/auth {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/projects {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/workspace {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/conversations {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/tasks {
            proxy_pass http://java_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---------- Python AI 服务: 推理 WebSocket ----------
        location /api/v1/agent/ws {
            proxy_pass http://python_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;   # 长连接 (多轮推理)
            proxy_send_timeout 3600s;
        }

        # ---------- Python AI 服务: 其余 API (默认兜底) ----------
        location /api/ {
            proxy_pass http://python_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 512m;
        }

        # ---------- GeoServer (WMS/REST, 浏览器直达绕 CORS) ----------
        location /geoserver/ {
            proxy_pass http://geoserver_backend;
            proxy_set_header Host $host;
        }

        # ---------- 前端静态文件 ----------
        location / {
            root ../frontend-vue/dist;   # 按部署路径调整
            try_files $uri $uri/ /index.html;
        }
    }
}
